<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✨ Mr. Manoj | AI Assistant</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-base: #030712;
      --glass-bg: rgba(17, 24, 39, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      --user-msg-bg: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      --bot-msg-bg: rgba(31, 41, 55, 0.7);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* THE ULTIMATE FIX FOR HORIZONTAL SCROLLING */
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      position: relative;
    }

    /* Subtle Tech Grid Overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      pointer-events: none;
    }

    /* Animated Background Orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      z-index: -1;
      animation: floatOrbs 20s infinite alternate ease-in-out;
    }
    .orb-1 { width: 450px; height: 450px; background: rgba(59, 130, 246, 0.35); top: -10%; left: -10%; }
    .orb-2 { width: 550px; height: 550px; background: rgba(139, 92, 246, 0.25); bottom: -20%; right: -10%; animation-delay: -5s; }
    .orb-3 { width: 350px; height: 350px; background: rgba(236, 72, 153, 0.2); top: 30%; left: 50%; transform: translateX(-50%); animation-delay: -10s; }

    /* --- PAGE WRAPPER --- */
    .page-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* --- Header & Small Top Logo --- */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
      flex-shrink: 0;
    }

    .top-logo {
      width: 75px;
      height: 75px;
      margin-bottom: 8px;
      border-radius: 50%;
      border: 3px solid transparent;
      background-image: linear-gradient(var(--bg-base), var(--bg-base)), var(--primary-gradient);
      background-origin: border-box;
      background-clip: content-box, border-box;
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
      object-fit: cover;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      text-align: center;
    }

    h1 span {
      background: var(--primary-gradient);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 4s linear infinite;
    }

    .social-links {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .social-links a {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
      fill: var(--text-muted);
    }
    .social-links a:hover { fill: #fff; border-color: #8b5cf6; transform: translateY(-3px); }
    .social-links svg { width: 16px; height: 16px; }

    /* ==========================================
       THE CSS GRID FIX (NO HORIZONTAL SCROLL)
       ========================================== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 280px; /* Locks sides, flexes center */
      gap: 25px;
      flex: 1; /* Takes up remaining height */
      min-height: 0; /* Prevents overflow pushing */
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }

    /* Left Panel: Big Profile Photo */
    .left-panel .glass-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .profile-hero {
      width: 100%;
      aspect-ratio: 1 / 1; /* Perfect Square/Circle */
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      border: 2px solid var(--glass-border);
    }

    .profile-name {
      text-align: center;
      font-weight: 600;
      font-size: 1.2rem;
      margin-top: 15px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    /* Right Panel Headers */
    .glass-card h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 8px;
    }

    /* Quick Chips */
    .chip-wrapper { display: flex; flex-direction: column; gap: 10px; }
    .chip {
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
      text-align: left;
    }
    .chip:hover { background: rgba(139, 92, 246, 0.2); border-color: #8b5cf6; color: #fff; transform: translateX(5px); }

    /* --- Center Chat Area --- */
    .main-chat {
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      min-height: 0;
    }

    #chat_container {
      flex: 1;
      width: 100%;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      scroll-behavior: smooth;
    }

    #chat_container::-webkit-scrollbar { width: 6px; }
    #chat_container::-webkit-scrollbar-track { background: transparent; }
    #chat_container::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; }

    /* Messages */
    .chat-bubble { padding: 16px 22px; border-radius: 20px; font-size: 0.95rem; line-height: 1.7; max-width: 85%; word-wrap: break-word; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.15); animation: messagePop 0.3s ease-out forwards; }
    .user { align-self: flex-end; background: var(--user-msg-bg); color: #ffffff; border-bottom-right-radius: 4px; transform-origin: bottom right; }
    .bot { align-self: flex-start; background: var(--bot-msg-bg); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); transform-origin: bottom left; color: var(--text-main); }

    /* Markdown Styling */
    .bot p { margin-bottom: 12px; }
    .bot p:last-child { margin-bottom: 0; }
    .bot h1, .bot h2, .bot h3, .bot h4 { margin-top: 18px; margin-bottom: 10px; font-weight: 600; color: #fff; }
    .bot h1:first-child, .bot h2:first-child, .bot h3:first-child { margin-top: 0; }
    .bot ul, .bot ol { margin-left: 25px; margin-bottom: 12px; }
    .bot li { margin-bottom: 6px; }
    .bot strong { font-weight: 700; color: #fff; }
    .bot code { background: rgba(0,0,0,0.4); padding: 3px 6px; border-radius: 6px; font-family: monospace; color: #60a5fa; }
    .bot pre { background: #0f172a; padding: 15px; border-radius: 12px; overflow-x: auto; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 12px;}
    .bot pre code { background: transparent; color: #e5e7eb; padding: 0; }

    /* Input Area */
    #input_container {
      width: 100%;
      display: flex;
      gap: 15px;
      align-items: flex-end;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 12px 15px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2), 0 4px 15px rgba(0,0,0,0.1);
      flex-shrink: 0; /* Prevents input box from getting squished */
    }
    #input_container:focus-within { border-color: #8b5cf6; }

    #user_input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 1.05rem;
      outline: none;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      overflow-y: auto;
      padding: 5px 0;
      line-height: 1.5;
    }
    #user_input::placeholder { color: #6b7280; font-weight: 300; }
    #user_input::-webkit-scrollbar { width: 4px; }
    #user_input::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 10px; }

    #send_btn {
      padding: 10px;
      height: 40px;
      width: 40px;
      background: var(--primary-gradient);
      background-size: 200% auto;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0;
    }
    #send_btn:hover { background-position: right center; transform: scale(1.05); }

    /* Footer Badge */
    .creator-badge {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      flex-shrink: 0;
    }
    .creator-badge span { color: #ec4899; font-weight: 600; }

    /* Animations */
    @keyframes floatOrbs { 0% { transform: translate(0, 0); } 50% { transform: translate(30px, -30px); } 100% { transform: translate(-20px, 20px); } }
    @keyframes gradientShift { to { background-position: 200% center; } }
    @keyframes messagePop { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    /* --- Responsiveness (Hides sides on small screens) --- */
    @media (max-width: 1050px) {
      .dashboard-grid { grid-template-columns: 1fr; } /* Only the center chat column */
      .left-panel, .right-panel { display: none; }
    }
    @media (max-width: 768px) {
      .page-wrapper { padding: 10px; }
      .top-logo { width: 60px; height: 60px; }
      h1 { font-size: 1.8rem; }
      #chat_container { padding: 15px; border-radius: 16px; }
      .chat-bubble { max-width: 92%; }
    }
  </style>
</head>

<body>

        <div class="glass-card">
          <img src="{{ url_for('static', filename='assets/hero.png') }}" alt="Manoj Hero" class="profile-hero" onerror="this.src='https://ui-avatars.com/api/?name=Mr+Manoj&background=8b5cf6&color=fff'">
          <div class="profile-name">Manoj Hanumanthu</div>

        <div id="chat_container">
          <div class="bot chat-bubble">Hello! I am Mr. Manoj Hanumanthu, your AI assistant. How can I help you today?</div>
        </div>

        <div id="input_container">
          <textarea id="user_input" rows="1" placeholder="Type a message... (Shift + Enter for new line)"></textarea>
          <button id="send_btn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>

          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            Quick Prompts
          </h3>
          <div class="chip-wrapper">
            <span class="chip" onclick="fillPrompt('Explain the fundamental principles of Chemical Engineering');">⚗️ Chem Engineering</span>
            <span class="chip" onclick="fillPrompt('Provide a detailed explanation of Indian Railways Electric Loco Shed codes and their meanings');">🚆 Loco Shed Codes</span>
            <span class="chip" onclick="fillPrompt('Describe the key maintenance equipment used in electric locomotive sheds');">⚙️ Loco Equipment</span>

  </div> <script>
    const userInput = document.getElementById("user_input");

    // Auto-fill prompt helper
    function fillPrompt(text) {
      userInput.value = text;
      adjustTextareaHeight();
      userInput.focus();
    }

    // Dynamic textarea resize
    function adjustTextareaHeight() {
      userInput.style.height = "auto";
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px"; // Cap max height
    }

    userInput.addEventListener("input", adjustTextareaHeight);

    // ChatGPT Style Enter / Shift+Enter Logic
    userInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        if (e.shiftKey) {
          // Do nothing, let the browser add a new line
          setTimeout(adjustTextareaHeight, 0);
        } else {
          // Prevent new line and send message
          e.preventDefault();
          sendMessage();
        }
      }
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      const chatContainer = document.getElementById("chat_container");

      // Render user message visually (convert \n to <br>)
      const userBubble = document.createElement("div");
      userBubble.className = "user chat-bubble";
      userBubble.innerHTML = text.replace(/\n/g, '<br>');
      chatContainer.appendChild(userBubble);
      chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: "smooth" });

      // Clean up input
      userInput.value = "";
      userInput.style.height = "auto";

      try {
        const response = await fetch("/chatbot", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text }) // Pass raw text to backend
        });

        if (!response.ok) {
            const errorText = await response.text();
            const errorBubble = document.createElement("div");
            errorBubble.className = "bot chat-bubble";
            errorBubble.style.color = "#ff7b72";
            errorBubble.textContent = errorText;
            chatContainer.appendChild(errorBubble);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: "smooth" });
            return;
        }

        const botBubble = document.createElement("div");
        botBubble.className = "bot chat-bubble";
        chatContainer.appendChild(botBubble);

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let botText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          botText += decoder.decode(value, { stream: true });
          botBubble.innerHTML = marked.parse(botText);
          chatContainer.scrollTo({ top: chatContainer.scrollHeight });
        }

      } catch (error) {
        console.error("Error:", error);
        const errorBubble = document.createElement("div");
        errorBubble.className = "bot chat-bubble";
        errorBubble.style.color = "#ff7b72";
        errorBubble.textContent = "Oops! Something went wrong. Check your connection.";
        chatContainer.appendChild(errorBubble);
      }
    }
  </script>
